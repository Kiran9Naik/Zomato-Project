name: zomato-service

on:
  push:
    branches: [ dev ]
  # pull_request:
  #   branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16'  # Change to match your project's Node.js version

    - name: Install dependencies
      run: npm install

    # - name: Run tests
    #   run: npm test

    - name: Build project
      run: npm run build
      # Optional: Only include this if your project has a build step
